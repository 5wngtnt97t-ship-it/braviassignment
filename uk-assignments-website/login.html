<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bravin Morara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <style>
        :root { --primary-color: #dc3545; --accent-color: #c82333; --dark-bg: #842029; }
        .logo-text { font-family: 'Lato', sans-serif; font-weight: 900; font-size: 24px; color: #fff; }
        .logo-text span { color: var(--accent-color); }
        .navbar { background: var(--dark-bg) !important; }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        footer { background: var(--dark-bg); color: #fff; padding: 40px 0 20px; }
        .login-card { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        body { background: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="logo-text">Bravin<span>Morara</span></span>
            </a>
        </div>
    </nav>

    <section class="py-5" style="margin-top: 100px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6" data-aos="zoom-in">
                    <div class="login-card">
                        <ul class="nav nav-tabs mb-4" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login">Sign In</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register">Sign Up</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="login">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="your@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="Password" required>
                                    </div>
                                    <button type="submit" class="btn w-100" style="background: var(--primary-color); color: #fff;">Sign In</button>
                                </form>
                            </div>
                            
                            <div class="tab-pane fade" id="register">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" class="form-control" placeholder="Your Name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="your@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="Create password" required>
                                    </div>
                                    <button type="submit" class="btn w-100" style="background: var(--primary-color); color: #fff;">Create Account</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="profileSection" class="py-5 d-none" style="background: var(--dark-bg); color: #fff;">
        <div class="container text-center">
            <h2>Welcome to Your Profile</h2>
            <div class="mt-4" id="profileContent">
                <div style="width: 100px; height: 100px; background: var(--primary-color); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 40px;">BM</div>
                <h4 class="mt-3" id="profileName">Loading...</h4>
                <p id="profileEmail"></p>
            </div>
            <div class="mt-4">
                <a href="order.html" class="btn btn-primary">Place New Order</a>
                <button class="btn btn-outline-light ms-2" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>

    <div class="whatsapp-float">
        <a href="https://wa.me/254714030732" target="_blank" class="btn btn-success rounded-circle shadow-lg" style="width: 60px; height: 60px;">
            <i class="fab fa-whatsapp fa-2x"></i>
        </a>
    </div>

    <footer>
        <div class="container text-center">
            <p>© 2026 Bravin Morara. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800 });
        
        // Check for existing token on page load
        document.addEventListener('DOMContentLoaded', async function() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('http://localhost:3000/api/profile', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (response.ok) {
                        const user = await response.json();
                        showProfile(user);
                    }
                } catch (e) {
                    console.log('Backend not available, using demo mode');
                }
            }
        });

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = this.querySelector('input[type="email"]').value;
            const password = this.querySelector('input[type="password"]').value;
            
            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    showProfile(data.user);
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (error) {
                // Demo mode fallback
                showProfile({ name: 'Demo User', email: email });
            }
        });

        // Handle register form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = this.querySelector('input[type="text"]').value;
            const email = this.querySelector('input[type="email"]').value;
            const password = this.querySelector('input[type="password"]').value;
            
            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (data.message) {
                    alert('Account created! Please sign in.');
                    document.getElementById('login-tab').click();
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (error) {
                // Demo mode fallback
                alert('Account created! Please sign in.');
                document.getElementById('login-tab').click();
            }
        });

        function showProfile(user) {
            document.querySelector('.login-card').closest('section').classList.add('d-none');
            document.getElementById('profileSection').classList.remove('d-none');
            document.getElementById('profileName').textContent = user.name || 'Bravin Morara Customer';
            document.getElementById('profileEmail').textContent = user.email || '';
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('profileSection').classList.add('d-none');
            document.querySelector('.login-card').closest('section').classList.remove('d-none');
        }
    </script>
</body>
</html>
